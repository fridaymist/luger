appId: fun.lugerhub.app
productName: Luger
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: python
    to: python
    filter: ["**/*", "!tests/**", "!**/__pycache__/**"]
  - from: runtime/${os}-${arch}
    to: runtime
  - from: build/icon.png
    to: icon.png
asarUnpack: []
publish:
  provider: github
  owner: fridaymist
  repo: luger
  releaseType: release
mac:
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target: [dmg, zip]
  icon: build/icon.png
  extendInfo:
    NSAppleEventsUsageDescription: Luger sends keyboard and mouse input for your macros.
win:
  target: [nsis]
  artifactName: ${productName}-${version}-windows-setup.${ext}
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Utility
  icon: build/icon.png
